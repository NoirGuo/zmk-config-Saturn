draw_config:
  key_w: 60
  key_h: 56
  split_gap: 30.0
  combo_w: 28
  combo_h: 26
  key_rx: 6.0
  key_ry: 6.0
  dark_mode: false
  n_columns: 1
  separate_combo_diagrams: false
  combo_diagrams_scale: 2
  inner_pad_w: 2.0
  inner_pad_h: 2.0
  outer_pad_w: 30.0
  outer_pad_h: 56.0
  line_spacing: 1.2
  arc_radius: 6.0
  append_colon_to_layer_header: true
  small_pad: 2.0
  legend_rel_x: 0.0
  legend_rel_y: 0.0
  draw_key_sides: false
  key_side_pars:
    rel_x: 0.0
    rel_y: 4.0
    rel_w: 12.0
    rel_h: 12.0
    rx: 4.0
    ry: 4.0
  svg_extra_style: |
    /* For default styles, see: https://github.com/caksoylar/keymap-drawer/blob/main/keymap_drawer/config.py#L85 */

    svg.keymap {
      font-family: Ubuntu Mono, Inconsolata, Consolas, Liberation Mono, Menlo, monospace;
      font-size: 12px;
      font-weight: bold;
      text-rendering: optimizeLegibility;
      background-color: #FFF;
    }

    /* Color accent for held keys */
    rect.held, rect.combo.held {
        fill: #ffc;
    }

  shrink_wide_legends: 6
  glyph_tap_size: 18
  glyph_hold_size: 15
  glyph_shifted_size: 15

parse_config:
  mark_alternate_layer_activators: true
  sticky_label: $$mdi:gesture-tap-hold$$
  toggle_label: "to"

  raw_binding_map:
    # Studio unlock
    "&studio_unlock":
      tap: $$mdi:lock-open-variant$$
      hold: "Studio"

    # Mouse keys
    "&mkp LCLK":
      tap: "L"
      hold: "Mouse"
    "&mkp RCLK":
      tap: "R"
      hold: "Mouse"
    "&mid_click MCLK 0":
      tap: "M"
      hold: "RGB"

    # RGB macros
    "&layer3light":
      tap: "RGB↗"
    "&layer0light":
      tap: "RGB✕"

    # Encoder (runtime sensor rotate)
    "&rsr_scroll":
      tap: "Scroll"
    "&rsr_vol":
      tap: "Vol"

    # Old-style volume encoder binding fallback
    "&inc_dec_kp C_VOL_UP C_VOL_DN":
      tap: "Vol"

    # Bluetooth
    "&bt BT_SEL 0":
      tap: $$mdi:bluetooth-connect$$
      hold: 1
    "&bt BT_SEL 1":
      tap: $$mdi:bluetooth-connect$$
      hold: 2
    "&bt BT_SEL 2":
      tap: $$mdi:bluetooth-connect$$
      hold: 3
    "&bt BT_CLR":
      tap: $$mdi:bluetooth-off$$
      hold: "Clear"
    "&out OUT_TOG":
      tap: $$mdi:toggle-switch$$
      hold: $$mdi:bluetooth$$

  zmk_keycode_map:
    # Defaults
    EXCLAMATION: "!"
    EXCL: "!"
    AT_SIGN: "@"
    AT: "@"
    HASH: "#"
    POUND: "#"
    DOLLAR: $
    DLLR: $
    PERCENT: "%"
    PRCNT: "%"
    CARET: ^
    AMPERSAND: "&"
    AMPS: "&"
    ASTERISK: "*"
    ASTRK: "*"
    STAR: "*"
    LEFT_PARENTHESIS: (
    LPAR: (
    RIGHT_PARENTHESIS: )
    RPAR: )
    EQUAL:
      tap: "="
      shifted: "+"
    PLUS: +
    MINUS:
      tap: "-"
      shifted: "_"
    UNDERSCORE: _
    UNDER: _
    SLASH:
      tap: "/"
      shifted: "?"
    FSLH:
      tap: "/"
      shifted: "?"
    QUESTION: "?"
    QMARK: "?"
    BACKSLASH:
      tap: '\\'
      shifted: "|"
    BSLH:
      tap: '\\'
      shifted: "|"
    PIPE: "|"
    SEMICOLON:
      tap: ";"
      shifted: ":"
    SEMI:
      tap: ";"
      shifted: ":"
    COLON: ":"
    SINGLE_QUOTE:
      tap: "'"
      shifted: '"'
    SQT:
      tap: "'"
      shifted: '"'
    APOSTROPHE: "'"
    APOS: "'"
    DOUBLE_QUOTES: '"'
    DQT: '"'
    COMMA:
      tap: ","
      shifted: "<"
    LESS_THAN: <
    LT: <
    PERIOD:
      tap: "."
      shifted: ">"
    DOT:
      tap: "."
      shifted: ">"
    GREATER_THAN: ">"
    GT: ">"
    LEFT_BRACKET:
      tap: "["
      shifted: "{"
    LBKT:
      tap: "["
      shifted: "{"
    LEFT_BRACE: "{"
    LBRC: "{"
    RIGHT_BRACKET:
      tap: "]"
      shifted: "}"
    RBKT:
      tap: "]"
      shifted: "}"
    RIGHT_BRACE: "}"
    RBRC: "}"
    GRAVE:
      tap: "`"
      shifted: "~"
    TILDE: "~"

    # Numbers
    N1:
      tap: 1
      shifted: "!"
    NUMBER_1:
      tap: 1
      shifted: "!"
    N2:
      tap: 2
      shifted: "@"
    NUMBER_2:
      tap: 2
      shifted: "@"
    N3:
      tap: 3
      shifted: "#"
    NUMBER_3:
      tap: 3
      shifted: "#"
    N4:
      tap: 4
      shifted: "$"
    NUMBER_4:
      tap: 4
      shifted: "$"
    N5:
      tap: 5
      shifted: "%"
    NUMBER_5:
      tap: 5
      shifted: "%"
    N6:
      tap: 6
      shifted: "^"
    NUMBER_6:
      tap: 6
      shifted: "^"
    N7:
      tap: 7
      shifted: "&"
    NUMBER_7:
      tap: 7
      shifted: "&"
    N8:
      tap: 8
      shifted: "*"
    NUMBER_8:
      tap: 8
      shifted: "*"
    N9:
      tap: 9
      shifted: "("
    NUMBER_9:
      tap: 9
      shifted: "("
    N0:
      tap: 0
      shifted: ")"
    NUMBER_0:
      tap: 0
      shifted: ")"

    # Navigations
    ESC: Esc
    ESCAPE: Esc
    HOME: Home
    END: End
    PAGE_UP: PgUp
    PAGE_DOWN: PgDn

    # Modifiers
    LSHFT: Shift
    LSHIFT: Shift
    LEFT_SHIFT: Shift
    RSHFT: Shift
    RSHIFT: Shift
    RIGHT_SHIFT: Shift
    LCTRL: Ctrl
    LEFT_CONTROL: Ctrl
    RCTRL: Ctrl
    RIGHT_CONTROL: Ctrl
    LALT: Alt
    LEFT_ALT: Alt
    RALT: Alt
    RIGHT_ALT: Alt
    LGUI: Win
    LG: Win
    LEFT_GUI: Win
    RCMD: Win
    RG: Win
    RIGHT_GUI: Win
    RIGHT_COMMAND: Win

    # Capslock
    CAPSLOCK: Caps
    CAPS: Caps

    # Enter / Tab / Space / Backspace
    ENTER:
      type: enter
      tap: $$mdi:keyboard-return$$
    RET:
      type: enter
      tap: $$mdi:keyboard-return$$
    RETURN:
      type: enter
      tap: $$mdi:keyboard-return$$
    TAB: $$mdi:keyboard-tab$$
    SPACE: $$mdi:keyboard-space$$
    BACKSPACE:
      type: backspace
      tap: $$mdi:backspace-outline$$
    BSPC:
      type: backspace
      tap: $$mdi:backspace-outline$$
    DELETE: Del
    DEL: Del

    # Arrows
    UP: $$mdi:arrow-up$$
    UP_ARROW: $$mdi:arrow-up$$
    DOWN: $$mdi:arrow-down$$
    DOWN_ARROW: $$mdi:arrow-down$$
    LEFT_ARROW: $$mdi:arrow-left$$
    LEFT: $$mdi:arrow-left$$
    RIGHT: $$mdi:arrow-right$$
    RIGHT_ARROW: $$mdi:arrow-right$$

    # Sound / media
    C_MUTE: $$mdi:volume-mute$$
    C_VOL_UP: $$mdi:volume-plus$$
    C_VOL_DN: $$mdi:volume-minus$$
    C_VOLUME_UP: $$mdi:volume-plus$$
    C_VOLUME_DOWN: $$mdi:volume-minus$$
    C_EJECT: ⏏

    # Numpad
    KP_NUMBER_0: "0"
    KP_N0: "0"
    KP_NUMBER_1: "1"
    KP_N1: "1"
    KP_NUMBER_2: "2"
    KP_N2: "2"
    KP_NUMBER_3: "3"
    KP_N3: "3"
    KP_NUMBER_4: "4"
    KP_N4: "4"
    KP_NUMBER_5: "5"
    KP_N5: "5"
    KP_NUMBER_6: "6"
    KP_N6: "6"
    KP_NUMBER_7: "7"
    KP_N7: "7"
    KP_NUMBER_8: "8"
    KP_N8: "8"
    KP_NUMBER_9: "9"
    KP_N9: "9"
    KP_PLUS: "+"
    KP_MINUS: "-"
    KP_MULTIPLY: "*"
    KP_DIVIDE: "/"
    KP_DOT: "."
    KP_ENTER:
      type: enter
      tap: $$mdi:keyboard-return$$

    # Bluetooth / output
    BT_CLR: $$mdi:bluetooth-off$$
    BT_SEL: $$mdi:bluetooth-connect$$
