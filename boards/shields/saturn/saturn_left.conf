# Left half (peripheral) configuration — ZMK 4.1 (DYA main+dya)
CONFIG_SPI=y
CONFIG_INPUT=y
CONFIG_ZMK_EXT_POWER=y
CONFIG_EC11=y
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y
CONFIG_ZMK_POINTING=y

# WS2812 RGB underglow
CONFIG_WS2812_STRIP=y
CONFIG_ZMK_RGB_UNDERGLOW=y
CONFIG_ZMK_RGB_UNDERGLOW_EXT_POWER=y

# Runtime sensor rotate (encoder tuned from central Studio)
CONFIG_ZMK_RUNTIME_SENSOR_ROTATE=y

# Split relay + settings RPC (runtime settings sync)
CONFIG_ZMK_SETTINGS_RPC=y
CONFIG_ZMK_SPLIT_RELAY_EVENT=y
CONFIG_ZMK_SPLIT_RELAY_EVENT_DATA_LEN=240
CONFIG_ZMK_SETTINGS_SAVE_DEBOUNCE=10000
