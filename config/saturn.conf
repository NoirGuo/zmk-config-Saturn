# ===================== 蓝牙参数配置 =====================
# 最大连接间隔（1.25ms 单位，9=11.25ms）
CONFIG_BT_PERIPHERAL_PREF_MAX_INT=9
# 连接延迟（主机跳过的连接事件数）
CONFIG_BT_PERIPHERAL_PREF_LATENCY=16
# 蓝牙发射功率 +8dBm（最大）
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y
# 启用蓝牙电池服务
CONFIG_BT_BAS=y
# 主控端获取从端电池电量（仅 central 有效，已移至 saturn_right.conf）

# ===================== 输入与外部电源 =====================
# 启用 SPI 总线支持
CONFIG_SPI=y
# 启用输入设备支持（trackball / input-listener）
CONFIG_INPUT=y
# 启用外部电源检测（LED 供电等）
CONFIG_ZMK_EXT_POWER=y
# 启用指点设备支持
CONFIG_ZMK_POINTING=y

# ===================== 按键消抖 =====================
CONFIG_ZMK_KSCAN_DEBOUNCE_PRESS_MS=5
CONFIG_ZMK_KSCAN_DEBOUNCE_RELEASE_MS=5

# ===================== 引脚相关 =====================
# 矩阵行使用了 NFC 引脚（D7/P0.09、D8/P0.10），需要以 GPIO 方式使用
CONFIG_NFCT_PINS_AS_GPIOS=y
