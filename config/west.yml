manifest:
  version: 1.2
  defaults:
    remote: cormoran
    revision: main
  remotes:
    - name: cormoran
      url-base: https://github.com/cormoran
    - name: tokyo2006
      url-base: https://github.com/tokyo2006
  projects:
    # DYA Studio fork of ZMK, main branch (Zephyr 4.1 based)
    - name: zmk
      remote: cormoran
      revision: main+dya
      import:
        file: app/west.yml
    # Zephyr 4.1 with ZMK fixes (half-duplex UART etc.)
    - name: zephyr
      remote: cormoran
      revision: v4.1.0+zmk-fixes+nrf-half-duplex-uart
      clone-depth: 1
      import:
        name-blocklist:
          - ci-tools
          - hal_altera
          - hal_cypress
          - hal_infineon
          - hal_microchip
          - hal_nxp
          - hal_openisa
          - hal_xtensa
          - hal_st
          - hal_ti
          - loramac-node
          - mcuboot
          - mcumgr
          - net-tools
          - openthread
          - edtt
          - trusted-firmware-m
          - chre
    # Runtime sensor rotate (encoder configurable from DYA Studio)
    - name: zmk-behavior-runtime-sensor-rotate
      remote: cormoran
      revision: main
    # PAW3222 trackball driver (main branch uses the `xinta` namespace
    # compatible with ZMK 4.1 / main+dya; v0.3 branch is for the old v0.3 DYA fork)
    - name: zmk-driver-paw3222
      remote: tokyo2006
      revision: main
    # DYA Studio modules
    - name: zmk-module-ble-management
      remote: cormoran
      revision: main
    - name: zmk-module-runtime-input-processor
      remote: cormoran
      revision: main
    - name: zmk-module-settings-rpc
      remote: cormoran
      revision: main
  self:
    path: config
